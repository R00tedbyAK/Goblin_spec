<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goblin_specs - Deep Technical & Media Inspector</title>
    <!-- Website Favicon -->
    <link rel="icon" type="image/png" href="/goblin-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes goblinScoutJump {
            0% { transform: translateY(150px) scale(0.2); opacity: 0; }
            60% { transform: translateY(-20px) scale(1.1); opacity: 1; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .animate-scout-1 { animation: goblinScoutJump 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-scout-2 { animation: goblinScoutJump 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.1s forwards; opacity: 0; }
        .animate-scout-3 { animation: goblinScoutJump 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s forwards; opacity: 0; }
    </style>
</head>
<body class="bg-[#050505] text-slate-100 min-h-screen flex flex-col items-center justify-center p-6 selection:bg-lime-500 selection:text-black overflow-x-hidden">

    <!-- Goblin Raid Popup Overlay -->
    <div id="goblinRaidOverlay" class="fixed inset-0 bg-black/80 z-50 hidden flex flex-col items-center justify-center space-y-6 backdrop-blur-sm">
        <h2 class="text-3xl font-black text-lime-400 tracking-wider animate-pulse">🧌 GOBLIN SCOUTS REPORTING IN! 🧌</h2>
        <div class="flex gap-4 md:gap-8 items-center justify-center px-4">
            <div class="animate-scout-1 flex flex-col items-center">
                <img src="/goblin-icon.png" class="w-24 h-24 md:w-32 md:h-32 rounded-2xl border-4 border-lime-500 object-cover shadow-[0_0_30px_rgba(132,204,22,0.5)] rotate-[-6deg]">
                <span class="mt-2 text-xs bg-lime-500 text-black font-bold px-2 py-0.5 rounded">Scout Alpha</span>
            </div>
            <div class="animate-scout-2 flex flex-col items-center translate-y-4">
                <img src="/goblin-icon.png" class="w-28 h-28 md:w-36 md:h-36 rounded-2xl border-4 border-lime-400 object-cover shadow-[0_0_40px_rgba(132,204,22,0.6)] scale-105">
                <span class="mt-2 text-xs bg-lime-400 text-black font-bold px-2 py-0.5 rounded">Chief Forager</span>
            </div>
            <div class="animate-scout-3 flex flex-col items-center">
                <img src="/goblin-icon.png" class="w-24 h-24 md:w-32 md:h-32 rounded-2xl border-4 border-lime-500 object-cover shadow-[0_0_30px_rgba(132,204,22,0.5)] rotate-[6deg]">
                <span class="mt-2 text-xs bg-lime-500 text-black font-bold px-2 py-0.5 rounded">Scout Beta</span>
            </div>
        </div>
        <p class="text-slate-400 text-sm italic">Foraging repository payloads...</p>
    </div>

    <div class="max-w-3xl w-full text-center space-y-6">
        <!-- Title with Goblin Green Theme -->
        <h1 class="text-4xl font-extrabold tracking-tight text-lime-400 drop-shadow-[0_0_15px_rgba(132,204,22,0.3)]">
            Goblin_specs Inspector
        </h1>
        <p class="text-slate-400">Let the pixel goblins forage public links for repository specs, languages, and media dimensions.</p>

        <!-- Input Box -->
        <div class="flex gap-2 max-w-xl mx-auto">
            <input type="text" id="urlInput" placeholder="Paste GitHub repo or media URL..." 
                class="flex-1 bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-lime-500 transition-colors">
            <button onclick="inspectUrl()" id="inspectBtn" 
                class="bg-lime-500 hover:bg-lime-400 text-black font-extrabold px-6 py-3 rounded-xl transition-all shadow-[0_0_20px_rgba(132,204,22,0.2)]">
                Inspect
            </button>
        </div>

        <!-- Loading / Status -->
        <div id="statusMsg" class="text-lime-400 font-medium h-6"></div>

        <!-- Result Card -->
        <div id="resultCard" class="hidden bg-neutral-900/90 border border-neutral-800 rounded-2xl p-6 text-left shadow-2xl space-y-6 backdrop-blur-md">
            
            <!-- Header Section -->
            <div class="flex items-center gap-4 border-b border-neutral-800 pb-4">
                <img id="resImage" src="" alt="Preview" class="w-20 h-20 rounded-xl object-cover border border-neutral-700 bg-neutral-950">
                <div>
                    <h2 id="resTitle" class="text-2xl font-bold text-white"></h2>
                    <p id="resDesc" class="text-slate-400 text-sm mt-1"></p>
                </div>
            </div>

            <!-- Dynamic Content Area -->
            <div id="resBody" class="space-y-4 text-sm">
                <!-- Injected via JavaScript based on data type -->
            </div>

        </div>
    </div>

    <script>
        async function inspectUrl() {
            const url = document.getElementById('urlInput').value.trim();
            const statusMsg = document.getElementById('statusMsg');
            const resultCard = document.getElementById('resultCard');
            const resImage = document.getElementById('resImage');
            const resTitle = document.getElementById('resTitle');
            const resDesc = document.getElementById('resDesc');
            const resBody = document.getElementById('resBody');
            const raidOverlay = document.getElementById('goblinRaidOverlay');

            if (!url) {
                statusMsg.innerText = "Please enter a valid URL!";
                return;
            }

            statusMsg.innerText = "";
            resultCard.classList.add('hidden');

            // Trigger Goblin Scouts Jumping Animation
            raidOverlay.classList.remove('hidden');

            try {
                // Keep the scouts jumping for a brief immersive moment
                const [response] = await Promise.all([
                    fetch('/api/inspect', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url })
                    }),
                    new Promise(resolve => setTimeout(resolve, 1200)) // 1.2s raid animation
                ]);

                const data = await response.json();
                raidOverlay.classList.add('hidden');

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to inspect link.');
                }

                resultCard.classList.remove('hidden');
                resImage.src = data.imageUrl || 'https://via.placeholder.com/150';

                if (data.type === 'github_repo') {
                    resTitle.innerText = data.repoName;
                    resDesc.innerText = data.description || "No description provided.";

                    let languagesHtml = Object.entries(data.languages)
                        .map(([lang]) => `<span class="bg-neutral-950 text-lime-400 border border-neutral-800 px-2.5 py-1 rounded-md text-xs font-mono">${lang}</span>`)
                        .join(' ') || '<span class="text-slate-500">No language data</span>';

                    let filesHtml = data.fileContents
                        .map(f => `<span class="bg-neutral-950/80 text-slate-300 border border-neutral-800/60 px-2 py-0.5 rounded text-xs">${f.type === 'dir' ? '📁' : '📄'} ${f.name}</span>`)
                        .join(' ');

                    resBody.innerHTML = `
                        <div class="grid grid-cols-2 gap-4 bg-neutral-950 p-4 rounded-xl border border-neutral-800">
                            <div>⭐ <strong class="text-white">Stars:</strong> ${data.stars}</div>
                            <div>🍴 <strong class="text-white">Forks:</strong> ${data.forks}</div>
                        </div>
                        <div>
                            <h3 class="font-semibold text-slate-300 mb-2">Languages Used:</h3>
                            <div class="flex flex-wrap gap-2">${languagesHtml}</div>
                        </div>
                        <div>
                            <h3 class="font-semibold text-slate-300 mb-2">Backend Stack Detected:</h3>
                            <div class="bg-neutral-950 p-3 rounded-xl border border-neutral-800 text-slate-300 space-y-1">
                                <div>🚀 <strong class="text-white">Runtime:</strong> ${data.backendService.stack}</div>
                                <div>📦 <strong class="text-white">Version:</strong> ${data.backendService.version}</div>
                            </div>
                        </div>
                        <div>
                            <h3 class="font-semibold text-slate-300 mb-2">Root File Contents (${data.fileContents.length}):</h3>
                            <div class="flex flex-wrap gap-2 max-h-36 overflow-y-auto p-2 bg-neutral-950 rounded-xl border border-neutral-800">${filesHtml}</div>
                        </div>
                    `;

                } else {
                    resTitle.innerText = "Media Asset Analysis";
                    resDesc.innerText = data.recommendation;

                    resBody.innerHTML = `
                        <div class="grid grid-cols-3 gap-4 bg-neutral-950 p-4 rounded-xl border border-neutral-800 text-center">
                            <div>
                                <div class="text-slate-400 text-xs">Aspect Ratio</div>
                                <div class="text-lg font-bold text-lime-400">${data.aspectRatio}</div>
                            </div>
                            <div>
                                <div class="text-slate-400 text-xs">Dimensions</div>
                                <div class="text-lg font-bold text-white">${data.width} × ${data.height} px</div>
                            </div>
                            <div>
                                <div class="text-slate-400 text-xs">Compatibility</div>
                                <div class="text-sm font-semibold text-emerald-400 mt-1">${data.recommendation}</div>
                            </div>
                        </div>
                    `;
                }

            } catch (err) {
                raidOverlay.classList.add('hidden');
                statusMsg.innerText = err.message;
                resultCard.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
